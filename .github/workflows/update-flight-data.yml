name: Update Flight Data

on:
  schedule:
    # 避開 GitHub Actions 整點排程尖峰
    - cron: '17 * * * *'
  workflow_dispatch: # 允許手動觸發
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-flight-data.yml'

permissions:
  contents: read

concurrency:
  group: update-flight-data
  cancel-in-progress: true

jobs:
  update-flight-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd scripts/scraper
          pip install -r requirements.txt
      
      - name: Run scraper
        run: |
          cd scripts/scraper
          python3 fetch-from-txt-api.py
      
      - name: Save to Firebase
        run: |
          mapfile -t changed_files < <(git ls-files --modified --others --exclude-standard -- 'data/flight-data-*.json')
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "No generated flight data files"
            exit 1
          fi
          python3 scripts/scraper/save-to-firebase.py "${changed_files[@]}"
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
